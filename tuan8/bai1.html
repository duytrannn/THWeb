<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>
    <!-- Bài 1: Hello jQuery -->
    <h1 id="title">Chào mừng đến Bookstore Online</h1>
    <p class="note">Đây là một đoạn mô tả.</p>
    <script>
        console.log("jQuery phiên bản:", $.fn.jquery);
        $("#title").css("color", "darkblue");
        $(".note").text("Nội dung này đã bị jQuery thay đổi!");
    </script>
    <!-- Bài 2: Selectors cơ bản (ID, class, thẻ) -->
    <div id="book-list">
        <div class="book" data-genre="fiction">
            <h3>Nhà Giả Kim</h3>
        </div>
        <div class="book" data-genre="skill">
            <h3>Đắc Nhân Tâm</h3>
        </div>
        <div class="book" data-genre="fiction">
            <h3>Hai Số Phận</h3>
        </div>
        <div class="book" data-genre="skill">
            <h3>Tư Duy Nhanh và Chậm</h3>
        </div>
    </div>
    <script>
        $("#book-list").css({
            "color": "red",
            "border": "1px solid green"
        })
        $(".book:first").css("color", "blue")
        $(".book:last").css({
            "color": "gray",
            "border": " 2px solid orange"
        })
        $(".book:eq(1)").css("border", "2px solid black")
    </script>
</body>

</html>
